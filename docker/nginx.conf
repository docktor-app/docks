server {
    listen 8080;
    root /usr/share/nginx/html;

    # Clean URLs: /guide/get-started is served from guide/get-started.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # VitePress hashes asset filenames, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}

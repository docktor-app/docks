# Publishes the Docktor docs image to GHCR after the docs build has passed.
#
# Tag rules, by event (same scheme as the docktor image):
#   push to main        -> edge, sha-<short>
#   tag vX.Y.Z          -> X.Y.Z, X.Y, latest, and X only when X is not 0
#   tag vX.Y.Z-rc.N     -> X.Y.Z-rc.N only
#
# A release tag must match the version in package.json, so the docs image carries the
# same version as Docktor itself.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history for VitePress last-updated timestamps

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          pkg=$(node -p "require('./package.json').version")
          if [ "v${pkg}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${pkg}"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run docs:build

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/docktor-app/docks
          flavor: |
            latest=false
          tags: |
            type=edge
            type=sha,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        env:
          IMAGE: ghcr.io/docktor-app/docks
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          docker run -d --name docs -p 8080:8080 "${IMAGE}@${DIGEST}"
          for i in $(seq 1 20); do
            curl -fs -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -fs -o /dev/null http://localhost:8080/
          curl -fs -o /dev/null http://localhost:8080/guide/get-started
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/does-not-exist)" = 404
          docker rm -f docs
